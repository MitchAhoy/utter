name: Utter
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Development.xcconfig
  Release: Config/Development.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 1.1.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
targets:
  Utter:
    type: application
    platform: macOS
    sources:
      - Sources/Utter
    dependencies:
      - package: KeyboardShortcuts
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.utter.app
        PRODUCT_NAME: Utter
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/Utter.entitlements
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  UtterLocalCheck:
    type: tool
    platform: macOS
    sources:
      - Sources/LocalCheck
      - Sources/Utter/Local/LocalModel.swift
      - Sources/Utter/Local/WhisperKitProvider.swift
      - Sources/Utter/Local/LocalModelStore.swift
      - Sources/Utter/Local/OfflineWhisperTokenizer.swift
      - Sources/Utter/Audio/RecordedAudio.swift
      - Sources/Utter/Pipeline/Providers.swift
      - Sources/Utter/Insertion/InsertionTypes.swift
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.utter.local-check
  UtterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/UtterTests
    dependencies:
      - target: Utter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.utter.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Utter.app/Contents/MacOS/Utter"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Utter:
    build:
      targets:
        Utter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UtterTests
    archive:
      config: Release
  UtterLocalCheck:
    build:
      targets:
        UtterLocalCheck: all
    run:
      config: Debug
